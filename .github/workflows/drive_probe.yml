name: Drive probe 3 (artifact)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/drive_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python seo/drive_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-files
          path: drive_files.json
