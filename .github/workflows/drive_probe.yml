name: Drive probe (one-off)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
import json, os
from google.oauth2 import service_account
from google.auth.transport.requests import AuthorizedSession
info = json.loads(os.environ["GCP_CREDENTIALS"])
print("SA_EMAIL:", info.get("client_email"))
creds = service_account.Credentials.from_service_account_info(info, scopes=["https://www.googleapis.com/auth/drive.readonly"])
sess = AuthorizedSession(creds)
queries = [
  "mimeType='application/vnd.google-apps.spreadsheet'",
  "name contains 'Performance-on-Search'",
  "name contains 'Performance on Search'",
  "name contains 'Search'",
  "fullText contains 'Performance-on-Search'",
]
for q in queries:
    r = sess.get("https://www.googleapis.com/drive/v3/files", params={"pageSize":50,"fields":"files(id,name,mimeType,owners(emailAddress))","q":q,"supportsAllDrives":"true","includeItemsFromAllDrives":"true"})
    print("=== QUERY:", q)
    print("STATUS:", r.status_code)
    try:
        j=r.json()
        files=j.get("files",[])
        print("COUNT:", len(files))
        for f in files[:10]:
            print(" FILE:", f.get("id"), "|", f.get("name"))
    except Exception as e:
        print("BODY:", r.text[:500])
PYEOF
