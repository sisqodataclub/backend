name: Probe Sheets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - name: Drive probe
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python - <<'PY'
          import os, json
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info = json.loads(os.environ['GCP_CREDENTIALS'])
          print('SA_EMAIL:', info.get('client_email'))
          for scope in ['https://www.googleapis.com/auth/drive.metadata.readonly', 'https://www.googleapis.com/auth/drive.readonly']:
              creds = service_account.Credentials.from_service_account_info(info, scopes=[scope])
              s = AuthorizedSession(creds)
              r = s.get('https://www.googleapis.com/drive/v3/files', params={'pageSize':10, 'fields':'files(id,name,mimeType)', 'q':"mimeType='application/vnd.google-apps.spreadsheet'"})
              print('SCOPE:', scope)
              print('STATUS:', r.status_code)
              print('BODY:', r.text[:1200])
              r2 = s.get('https://www.googleapis.com/drive/v3/files', params={'pageSize':10, 'fields':'files(id,name,mimeType)', 'q':"name contains 'Performance-on-Search'"})
              print('Q2_STATUS:', r2.status_code)
              print('Q2_BODY:', r2.text[:1200])
          PY