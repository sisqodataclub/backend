name: Test GCP Sheets Access

on:
  workflow_dispatch:
  push:
    branches:
      - test-gcp-sheets-workflow

permissions:
  contents: write

jobs:
  test-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: test-gcp-sheets-workflow
          persist-credentials: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Dump accessible spreadsheets and all tab values
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          TARGET_SHEET_NAME: 'ddeepcleaningservices.com-Performance-on-Search-2026-07-20'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from googleapiclient.discovery import build

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          md_lines = []
          index = []

          def emit(md):
              print(md)
              md_lines.append(md)
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as fh:
                      fh.write(md + '\n')

          def slug(name):
              return re.sub(r'[^A-Za-z0-9._-]+', '_', name)[:120]

          emit('## Google Sheets extraction (with tab values)')
          emit('')

          creds_path = os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          client_email = '(unknown)'
          try:
              with open(creds_path, 'r', encoding='utf-8') as fh:
                  creds = json.load(fh)
              client_email = creds.get('client_email', '(missing in credentials)')
          except Exception as e:
              client_email = f'(failed to read credentials: {e})'
          emit(f'SERVICE_ACCOUNT_CLIENT_EMAIL: {client_email}')
          emit('')

          try:
              drive = build('drive', 'v3')
              sheets = build('sheets', 'v4')
          except Exception as e:
              emit(f'**Failed to build Google API clients:** {e}')
              emit('TOTAL_SHEETS_FOUND: 0')
              with open('gcp-sheets-list.md', 'w', encoding='utf-8') as fh:
                  fh.write('\n'.join(md_lines))
              with open('gcp-sheets-list.json', 'w', encoding='utf-8') as fh:
                  json.dump(index, fh, indent=2)
              sys.exit(1)

          try:
              resp = drive.files().list(
                  q="mimeType='application/vnd.google-apps.spreadsheet'",
                  fields='files(id,name)',
                  pageSize=1000,
              ).execute()
          except Exception as e:
              emit(f'**Drive list call failed:** {e}')
              emit('TOTAL_SHEETS_FOUND: 0')
              with open('gcp-sheets-list.md', 'w', encoding='utf-8') as fh:
                  fh.write('\n'.join(md_lines))
              with open('gcp-sheets-list.json', 'w', encoding='utf-8') as fh:
                  json.dump(index, fh, indent=2)
              sys.exit(1)

          files = resp.get('files', [])
          emit(f'TOTAL_SHEETS_FOUND: {len(files)}')
          emit('')

          os.makedirs('gcp-sheets-data', exist_ok=True)

          target = os.environ.get('TARGET_SHEET_NAME', '').strip()
          if target:
              emit(f'TARGET_SHEET_NAME: {target}')
              emit('')

          for f in files:
              sid = f['id']
              name = f.get('name', '(no name)')
              emit(f'### {name}')
              emit('')
              emit(f'- id: `{sid}`')
              try:
                  meta = sheets.spreadsheets().get(spreadsheetId=sid).execute()
                  tab_meta = meta.get('sheets', [])
              except Exception as e:
                  emit(f'- ERROR reading spreadsheet metadata: {e}')
                  emit('')
                  index.append({'id': sid, 'name': name, 'error': str(e)})
                  continue

              tab_summaries = []
              per_sheet = {'id': sid, 'name': name, 'tabs': []}
              for s in tab_meta:
                  title = s['properties']['title']
                  try:
                      vr = sheets.spreadsheets().values().get(
                          spreadsheetId=sid,
                          range=f"'{title}'",
                      ).execute()
                      values = vr.get('values', [])
                  except Exception as e:
                      values = []
                      emit(f'  - {title}: ERROR {e}')
                  row_count = len(values)
                  col_count = max((len(r) for r in values), default=0)
                  tab_summaries.append({'title': title, 'rows': row_count, 'cols': col_count})
                  per_sheet['tabs'].append({'title': title, 'rows': values})
                  emit(f'  - {title}: rows={row_count} cols={col_count}')

              fname = f'gcp-sheets-data/{slug(name)}__{sid}.json'
              with open(fname, 'w', encoding='utf-8') as fh:
                  json.dump(per_sheet, fh, indent=2)
              emit('')
              emit(f'- dumped: `{fname}`')
              emit('')
              index.append({'id': sid, 'name': name, 'tabs': tab_summaries, 'file': fname})

          with open('gcp-sheets-list.md', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(md_lines) + '\n')
          with open('gcp-sheets-list.json', 'w', encoding='utf-8') as fh:
              json.dump(index, fh, indent=2)
          PY

      - name: Commit extracted data back to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gcp-sheets-list.md gcp-sheets-list.json gcp-sheets-data || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update gcp-sheets extraction [skip ci]'
            git push origin HEAD:test-gcp-sheets-workflow
          fi

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-sheets-extraction
          path: |
            gcp-sheets-list.md
            gcp-sheets-list.json
            gcp-sheets-data/**
          if-no-files-found: warn
