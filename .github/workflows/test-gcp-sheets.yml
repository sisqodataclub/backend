name: Test GCP Sheets Access

on:
  workflow_dispatch:
  push:
    branches:
      - test-gcp-sheets-workflow

permissions:
  contents: write

jobs:
  test-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: test-gcp-sheets-workflow
          persist-credentials: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: List accessible spreadsheets and their tabs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from googleapiclient.discovery import build

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          md_lines = []
          data = []

          def emit(md):
              print(md)
              md_lines.append(md)
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as fh:
                      fh.write(md + '\n')

          emit('## Google Sheets accessible to service account')
          emit('')

          # --- Surface the service account identity ---
          creds_path = os.environ.get('GOOGLE_APPLICATION_CREDENTIALS')
          client_email = '(unknown)'
          try:
              with open(creds_path, 'r', encoding='utf-8') as fh:
                  creds = json.load(fh)
              client_email = creds.get('client_email', '(missing in credentials)')
          except Exception as e:
              client_email = f'(failed to read credentials: {e})'
          emit(f'SERVICE_ACCOUNT_CLIENT_EMAIL: {client_email}')
          emit('')

          try:
              drive = build('drive', 'v3')
              sheets = build('sheets', 'v4')
          except Exception as e:
              emit(f'**Failed to build Google API clients:** {e}')
              emit('TOTAL_SHEETS_FOUND: 0')
              with open('gcp-sheets-list.md', 'w', encoding='utf-8') as fh:
                  fh.write('\n'.join(md_lines))
              with open('gcp-sheets-list.json', 'w', encoding='utf-8') as fh:
                  json.dump(data, fh, indent=2)
              sys.exit(1)

          try:
              resp = drive.files().list(
                  q="mimeType='application/vnd.google-apps.spreadsheet'",
                  fields='files(id,name)',
                  pageSize=1000,
              ).execute()
          except Exception as e:
              emit(f'**Drive list call failed:** {e}')
              emit('TOTAL_SHEETS_FOUND: 0')
              with open('gcp-sheets-list.md', 'w', encoding='utf-8') as fh:
                  fh.write('\n'.join(md_lines))
              with open('gcp-sheets-list.json', 'w', encoding='utf-8') as fh:
                  json.dump(data, fh, indent=2)
              sys.exit(1)

          files = resp.get('files', [])
          emit(f'TOTAL_SHEETS_FOUND: {len(files)}')
          emit('')
          if not files:
              emit('_No spreadsheets accessible with this service account._')
          else:
              emit(f'**Found {len(files)} accessible spreadsheet(s):**')
              emit('')
              for f in files:
                  sid = f['id']
                  name = f.get('name', '(no name)')
                  emit(f'### {name}')
                  emit('')
                  emit(f'- id: `{sid}`')
                  try:
                      meta = sheets.spreadsheets().get(spreadsheetId=sid).execute()
                      tabs = [s['properties']['title'] for s in meta.get('sheets', [])]
                  except Exception as e:
                      tabs = [f'<error reading tabs: {e}>']
                  if tabs:
                      emit('- tabs:')
                      for t in tabs:
                          emit(f'  - {t}')
                  else:
                      emit('- tabs: _(none)_')
                  emit('')
                  data.append({'id': sid, 'name': name, 'tabs': tabs})

          with open('gcp-sheets-list.md', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(md_lines) + '\n')
          with open('gcp-sheets-list.json', 'w', encoding='utf-8') as fh:
              json.dump(data, fh, indent=2)
          PY

      - name: Commit sheet list back to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gcp-sheets-list.md gcp-sheets-list.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update gcp-sheets-list.md [skip ci]'
            git push origin HEAD:test-gcp-sheets-workflow
          fi

      - name: Upload sheet list artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-sheets-list
          path: |
            gcp-sheets-list.md
            gcp-sheets-list.json
          if-no-files-found: warn
