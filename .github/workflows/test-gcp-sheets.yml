name: Test GCP Sheets Access

on:
  workflow_dispatch:
  push:
    branches:
      - test-gcp-sheets-workflow

jobs:
  test-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: List accessible spreadsheets and their tabs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          python - <<'PY'
          import sys
          from googleapiclient.discovery import build

          try:
              drive = build('drive', 'v3')
              sheets = build('sheets', 'v4')
          except Exception as e:
              print(f"Failed to build Google API clients: {e}")
              sys.exit(1)

          try:
              resp = drive.files().list(
                  q="mimeType='application/vnd.google-apps.spreadsheet'",
                  fields='files(id,name)',
                  pageSize=1000,
              ).execute()
          except Exception as e:
              print(f"Drive list call failed: {e}")
              sys.exit(1)

          files = resp.get('files', [])
          if not files:
              print("No spreadsheets accessible with this service account.")
              sys.exit(0)

          print(f"Found {len(files)} accessible spreadsheet(s):\n")
          for f in files:
              sid = f['id']
              name = f.get('name', '(no name)')
              try:
                  meta = sheets.spreadsheets().get(spreadsheetId=sid).execute()
                  tabs = [s['properties']['title'] for s in meta.get('sheets', [])]
              except Exception as e:
                  tabs = [f"<error reading tabs: {e}>"]
              print(f"- {name} (id={sid})")
              for t in tabs:
                  print(f"    tab: {t}")
              print()
          PY
