name: Deploy Backend Architecture

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt
            chmod +x deploy_mr.sh
            /opt/deploy-wrapper.sh 6ef34dab-51a1-4ff7-8e36-6cdd92f034c6 forms /opt/deploy_mr.sh
