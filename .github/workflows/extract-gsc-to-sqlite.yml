name: Extract GSC to SQLite

on:
  workflow_dispatch:
  push:
    branches:
      - test-gsc-workflow
    paths:
      - '.github/workflows/.trigger-gsc'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-gsc-workflow

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Extract GSC
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python - <<'PY'
          import os, json, sqlite3, re, datetime, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds_info = json.loads(os.environ['GCP_CREDENTIALS'])
          creds = service_account.Credentials.from_service_account_info(
              creds_info,
              scopes=['https://www.googleapis.com/auth/webmasters.readonly'],
          )
          print('Service account:', creds_info.get('client_email'))

          service = build('searchconsole', 'v1', credentials=creds, cache_discovery=False)

          try:
              sites_resp = service.sites().list().execute()
          except Exception as e:
              print('ERROR listing sites:', e)
              sys.exit(2)

          sites = sites_resp.get('siteEntry', [])
          print('Sites found:', len(sites))
          for s in sites:
              print(' -', s.get('siteUrl'), s.get('permissionLevel'))

          if not sites:
              print('NO_SITES: service account has no GSC properties. Grant access in Search Console -> Settings -> Users and permissions.')
              sys.exit(3)

          db_path = 'gsc_extract.sqlite3'
          if os.path.exists(db_path):
              os.remove(db_path)
          con = sqlite3.connect(db_path)
          cur = con.cursor()
          cur.execute('''CREATE TABLE _meta (
              site TEXT, permission TEXT, start_date TEXT, end_date TEXT,
              dimension TEXT, row_count INTEGER, extracted_at TEXT
          )''')

          end_date = datetime.date.today() - datetime.timedelta(days=2)
          start_date = end_date - datetime.timedelta(days=90)
          s_str, e_str = start_date.isoformat(), end_date.isoformat()

          def sanitize(name):
              return re.sub(r'[^a-zA-Z0-9_]', '_', name).strip('_').lower()[:60]

          dimension_sets = [
              ('query_page_date_country_device', ['query','page','date','country','device']),
              ('query', ['query']),
              ('page', ['page']),
              ('date', ['date']),
              ('country', ['country']),
              ('device', ['device']),
          ]

          for site in sites:
              site_url = site['siteUrl']
              site_slug = sanitize(site_url.replace('https://','').replace('http://','').replace('sc-domain:',''))
              for dim_name, dims in dimension_sets:
                  table = f'{site_slug}__{dim_name}'
                  cur.execute(f'DROP TABLE IF EXISTS "{table}"')
                  cols = dims + ['clicks','impressions','ctr','position']
                  col_defs = ', '.join([f'"{c}" TEXT' if c in dims else f'"{c}" REAL' for c in cols])
                  cur.execute(f'CREATE TABLE "{table}" ({col_defs})')

                  start_row = 0
                  row_limit = 25000
                  total = 0
                  while True:
                      body = {
                          'startDate': s_str,
                          'endDate': e_str,
                          'dimensions': dims,
                          'rowLimit': row_limit,
                          'startRow': start_row,
                      }
                      try:
                          resp = service.searchanalytics().query(siteUrl=site_url, body=body).execute()
                      except Exception as e:
                          print(f'ERROR querying {site_url} dims={dims}:', e)
                          break
                      rows = resp.get('rows', [])
                      if not rows:
                          break
                      placeholders = ','.join(['?']*len(cols))
                      for r in rows:
                          keys = r.get('keys', [])
                          vals = list(keys) + [r.get('clicks',0), r.get('impressions',0), r.get('ctr',0), r.get('position',0)]
                          cur.execute(f'INSERT INTO "{table}" VALUES ({placeholders})', vals)
                          total += 1
                      if len(rows) < row_limit:
                          break
                      start_row += row_limit
                  cur.execute('INSERT INTO _meta VALUES (?,?,?,?,?,?,?)',
                      (site_url, site.get('permissionLevel'), s_str, e_str, dim_name, total, datetime.datetime.utcnow().isoformat()))
                  print(f'{table}: {total} rows')
              con.commit()

          con.commit()
          con.close()
          print('DONE')
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc_extract
          path: gsc_extract.sqlite3
          if-no-files-found: warn

      - name: Commit sqlite back
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add gsc_extract.sqlite3
          git diff --cached --quiet || git commit -m 'chore: update gsc_extract.sqlite3 [skip ci]'
          git push
